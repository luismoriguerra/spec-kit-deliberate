# Deliberate extension configuration.
# Copy to deliberate-config.yml and customize. Layered with environment
# overrides (SPECKIT_DELIBERATE_*) where your tooling supports them.

# Directory (relative to the feature dir) holding DR files.
decisions_dir: decisions

# Heading in spec.md under which the Decision records ledger lives.
ledger_heading: "### Decision records"

# Append a tasks.md subtask referencing each new DR.
task_enabled: true

# Evidence bar every DR must clear.
evidence_rule: ">=1 file:line or measured query result"

# Platform routing overlay. Empty by default: with no adr_command and no
# platform_signals, platform-scoped findings are reported in chat instead of
# delegated. Projects with an ADR workflow set these (see docs/platform-overlay-example.md).
platform_routing:
  adr_command: ""
  platform_signals: []

# Autopilot (speckit.deliberate.autopilot). Every key is optional: a missing block
# or key takes the default shown here. See docs/autopilot.md.
autopilot:
  mode: auto                   # auto (detect) | initial | iterate
  run_specify: true            # false = require an existing spec
  report_file: autopilot-report.md  # one run section appended per run, in the feature dir
  sweep_depth: standard        # quick | standard | deep
  context_sources: []          # extra read-only paths: runbooks, wikis, ADR dirs
  require_constitution: false  # true = BLOCKED when no constitution is found
  approval: queue              # queue | accept-evidenced (new evidenced DRs written Accepted)
  default_policy: balanced     # balanced | conservative | stop (no defaults)
  defaultable_max_rank: P1     # gaps ranked above this are never defaulted
  mark_assumed: "[assumed]"    # tag written next to defaulted content
  auto_remediate: true         # false = report remediations without editing
  clarify_max_interrupts: 3    # clarify interrupts per run
  analyze_max_passes: 2        # analyze -> remediate passes per run
  chat_report: brief           # brief | full — chat digest vs full run section (file always full)
  triage_pass: true            # false = skip Step 8's triage pass (verdict capped at READY WITH PENDING DECISIONS)
