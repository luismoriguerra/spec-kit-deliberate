schema_version: "1.0"

extension:
  id: deliberate
  name: Deliberate
  version: 0.1.1
  description: Read-only exploration plus evidence-backed feature decision records
  author: luismoriguerra
  repository: https://github.com/luismoriguerra/spec-kit-deliberate
  license: MIT

requires:
  speckit_version: ">=1.0.0"

provides:
  commands:
    - name: speckit.deliberate.explore
      file: commands/explore.md
      description: Explore options read-only before spec, plan, or a decision
    - name: speckit.deliberate.record
      file: commands/record.md
      description: Record, supersede, or batch-create feature decision records
  templates:
    - name: decision-record-template
      file: templates/decision-record-template.md
      description: Feature-scoped decision record with evidence and revisit trigger
  config:
    - name: deliberate-config.yml
      template: config-template.yml
      description: Decisions dir, ledger heading, and platform-routing overlay
      required: false

tags:
  - decisions
  - exploration
  - workflow
  - governance
